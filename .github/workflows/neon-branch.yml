name: Neon Database Preview Branch

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches:
      - main
      - develop

jobs:
  manage-preview-branch:
    name: Neon Preview Branch Management
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------
      # 1. Create Preview Branch (opened, reopened, synchronize)
      # -----------------------------------------------------------
      - name: Create Neon Preview Branch
        id: create-branch
        if: github.event.action != 'closed'
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.number }}

      - name: Setup pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Run Prisma Migrations on Neon Preview Branch
        if: github.event.action != 'closed'
        run: pnpm --filter @zentra/api run db:deploy
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url_with_pooler }}
          DIRECT_DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}

      - name: Run Tests with Neon Preview Connection
        if: github.event.action != 'closed'
        run: pnpm --filter @zentra/api run test -- --maxWorkers=2
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url_with_pooler }}
          DIRECT_DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}
          JWT_ACCESS_SECRET: test_jwt_access_super_secret_key_32_chars_min
          JWT_REFRESH_SECRET: test_jwt_refresh_super_secret_key_32_chars_min

      - name: Output Neon Branch Details
        if: github.event.action != 'closed'
        run: |
          echo "Neon Branch ID: ${{ steps.create-branch.outputs.branch_id }}"
          echo "Neon Branch Name: preview/pr-${{ github.event.number }}"
          echo "Branch Pooled Host: ${{ steps.create-branch.outputs.host_with_pooler }}"

      # -----------------------------------------------------------
      # 2. Delete Preview Branch when Pull Request Closes
      # -----------------------------------------------------------
      - name: Delete Neon Preview Branch
        if: github.event.action == 'closed'
        uses: neondatabase/delete-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.number }}
