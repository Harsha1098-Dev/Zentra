version: '3.8'

# ====================================================================
# Zentra SaaS Platform - Docker Compose
# Neon PostgreSQL is the primary database for production and development.
# The local 'postgres' service below is for OPTIONAL offline development only.
# ====================================================================

services:
  # Optional local PostgreSQL (for offline development only)
  postgres:
    image: postgres:16-alpine
    container_name: zentra-postgres
    restart: unless-stopped
    profiles: ["offline"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-zentra_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zentra_pgdata:/var/lib/postgresql/data
      - ./infra/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zentra_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zentra-network

  redis:
    image: redis:7-alpine
    container_name: zentra-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - zentra_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - zentra-network

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: zentra-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://neondb_owner:npg_GCQO7c6dTfDb@ep-silent-art-bdvrk9iw-pooler.c-8.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-postgresql://neondb_owner:npg_GCQO7c6dTfDb@ep-silent-art-bdvrk9iw.c-8.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-zentra_jwt_access_super_secret_key_change_in_production_min_32_chars}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-zentra_jwt_refresh_super_secret_key_change_in_production_min_32_chars}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - zentra-network
    networks:
      - zentra-network

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: zentra-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    depends_on:
      - api
    networks:
      - zentra-network

volumes:
  zentra_pgdata:
  zentra_redisdata:

networks:
  zentra-network:
    driver: bridge
